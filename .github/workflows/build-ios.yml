name: Build iOS App (.IPA)

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Bump App Version & Build Number
        run: |
          VERSION="1.0.${{ github.run_number }}"
          BUILD="${{ github.run_number }}"
          echo "Setting app version to $VERSION (Build $BUILD)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" ios/CFXFrameStudio/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" ios/CFXFrameStudio/Info.plist

      - name: Resolve Swift Package Dependencies
        run: |
          cd ios
          xcodebuild -resolvePackageDependencies -project CFXFrameStudio.xcodeproj

      - name: Build iOS App Bundle (Unsigned)
        run: |
          cd ios
          xcodebuild build \
            -project CFXFrameStudio.xcodeproj \
            -scheme CFXFrameStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .IPA for Sideloading
        run: |
          cd ios
          APP_PATH=$(find build -name "CFXFrameStudio.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p "$APP_PATH/Frameworks"

          # Copy any PackageFrameworks that Xcode did not embed automatically
          if [ -d "build/Build/Products/Release-iphoneos/PackageFrameworks" ]; then
            echo "Copying PackageFrameworks into $APP_PATH/Frameworks/..."
            cp -R build/Build/Products/Release-iphoneos/PackageFrameworks/* "$APP_PATH/Frameworks/" 2>/dev/null || true
          fi

          echo "Embedded frameworks inside CFXFrameStudio.app/Frameworks:"
          ls -la "$APP_PATH/Frameworks"

          cp CFXFrameStudio/AppIcon*.png "$APP_PATH/" 2>/dev/null || true

          # Ad-hoc code sign all embedded frameworks and the main executable for reliable sideloading
          echo "Ad-hoc code signing all frameworks..."
          find "$APP_PATH/Frameworks" -mindepth 1 -maxdepth 1 -name "*.framework" -exec /usr/bin/codesign --force --sign - --timestamp=none {} \; 2>/dev/null || true
          /usr/bin/codesign --force --sign - --timestamp=none "$APP_PATH" 2>/dev/null || true

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -y CFXFrameStudio.ipa Payload
          ls -lh CFXFrameStudio.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFXFrameStudio-iOS-IPA
          path: ios/CFXFrameStudio.ipa
          retention-days: 14

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "CFX FrameStudio iOS v1.0.${{ github.run_number }}"
          body: |
            ### ⚡ CFX FrameStudio iOS v1.0.${{ github.run_number }}
            
            **Direct 1-Click Sideload Install:**
            Download **`CFXFrameStudio.ipa`** directly to your iPhone below (no unzipping needed!).
            
            - **App Version**: `1.0.${{ github.run_number }}`
            - **Build**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            
            #### 📱 How to Install on iPhone:
            1. Tap **`CFXFrameStudio.ipa`** below to download directly in Safari.
            2. When downloaded, open Safari Downloads > tap Share.
            3. Choose **AltStore**, **Sideloadly**, or **TrollStore** to install.
            
            #### 🛠️ Studio Tools Included:
            - 🎞️ **Matroska (.MKV / .WebM) Import & Lossless Remux Engine** (Zero re-encoding stream copy powered by FFmpeg)
            - ✂️ **Lossless Video Trimmer** (Instant stream-copy cut & audio toggle for MP4, MOV & MKV)
            - 🎞️ **Precise Frame Exporter** (1f & 10f hardware stepping to PNG/JPG)
            - 🔄 **Video Format Converter** (MP4 ↔ MOV & MKV with ProRes & HEVC)
            - 📐 **Lossless Image Cropper** (Adjustable frame, 4-corner handles, pinch zoom & social aspect ratios)
            - ⬇️ **Direct & YouTube Downloader** (Fetch Cloudflare, S3, CDN & YouTube up to 4K/8K with smart Camera Roll & Files routing)
            - 🧹 **App Storage & Cache Manager** (Clear temporary cache, wipe downloaded documents, and purge app media from Camera Roll)
            - 📁 **Files App Integration** (`On My iPhone > CFX Studio`)
          files: ios/CFXFrameStudio.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
