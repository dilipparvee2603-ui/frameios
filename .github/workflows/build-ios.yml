name: Build iOS App (.IPA)

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build iOS App Bundle (Unsigned)
        run: |
          cd ios
          xcodebuild build \
            -project CFXFrameStudio.xcodeproj \
            -scheme CFXFrameStudio \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .IPA for Sideloading
        run: |
          cd ios
          APP_PATH=$(find build -name "CFXFrameStudio.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CFXFrameStudio.ipa Payload
          ls -lh CFXFrameStudio.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFXFrameStudio-iOS-IPA
          path: ios/CFXFrameStudio.ipa
          retention-days: 14
