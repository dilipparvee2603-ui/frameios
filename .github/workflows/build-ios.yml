name: Build iOS App (.IPA)

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer

      - name: Build iOS App Bundle (Unsigned)
        run: |
          cd ios
          xcodebuild build \
            -project CFXFrameStudio.xcodeproj \
            -scheme CFXFrameStudio \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package .IPA for Sideloading
        run: |
          cd ios
          APP_PATH=$(find build -name "CFXFrameStudio.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CFXFrameStudio.ipa Payload
          ls -lh CFXFrameStudio.ipa

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CFXFrameStudio-iOS-IPA
          path: ios/CFXFrameStudio.ipa
          retention-days: 14

      - name: Publish Direct 1-Click .IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0-latest"
          name: "CFX FrameStudio iOS — Direct 1-Click IPA"
          body: |
            ### ⚡ Direct 1-Click IPA Sideload
            
            Download **`CFXFrameStudio.ipa`** directly to your iPhone below (no unzipping needed!).
            
            #### 📱 Direct iPhone Install:
            1. Tap **`CFXFrameStudio.ipa`** below to download directly in Safari.
            2. When downloaded, open Safari Downloads > tap Share.
            3. Choose **AltStore**, **Sideloadly**, or **TrollStore** to install.
            
            #### 🛠️ Studio Tools Included:
            - ✂️ **Lossless Video Trimmer** (Instant stream-copy cut & audio toggle)
            - 🎞️ **Precise Frame Exporter** (1f & 10f hardware stepping to PNG/JPG)
            - 🔄 **Video Format Converter** (MP4 ↔ MOV with ProRes & HEVC)
            - 📐 **Lossless Image Cropper** (Adjustable frame, 4-corner handles, pinch zoom & social aspect ratios)
            - 📁 **Files App Integration** (`On My iPhone > CFX Studio`)
          files: ios/CFXFrameStudio.ipa
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
